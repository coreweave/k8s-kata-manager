---
name: On Pull Request

on:
  pull_request:
    branches:
      - main
      - coreweave

jobs:
  build-and-push-image:
    uses: ./.github/workflows/publish-image.yaml
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DOPPLER_PROJECT: ${{ secrets.DOPPLER_PROJECT }}
      DOPPLER_CONFIG: ${{ secrets.DOPPLER_CONFIG }}
    with:
      tag: ${{ github.sha }}
